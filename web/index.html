<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Research Agent · 推理研究工作台</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <header class="top"><div class="wrap brand"><span class="mark" aria-hidden="true">R</span> Research Agent <span class="environment">本机 MLX-LM</span></div></header>
  <main class="wrap">
    <h1>推理研究工作台</h1>
    <form id="research" class="panel">
      <div class="question-field">
        <label for="question">研究问题</label>
        <textarea id="question" maxlength="2000" rows="2" required>MLX-LM 的前缀缓存能否降低首 token 延迟？请实测，并根据结果决定补测或复测。</textarea>
      </div>
      <div class="budget-field">
        <label for="budget">实验次数上限</label>
        <select id="budget"><option>1</option><option>2</option><option selected>3</option></select>
      </div>
      <button class="primary" id="start">运行研究</button>
    </form>
    <div class="workspace">
      <section class="panel timeline">
        <div class="section-title"><h2>实验时间线</h2><span id="status" class="status" role="status">待运行</span></div>
        <p id="context" class="context" hidden></p>
        <p id="hint" class="muted">发起研究后，在这里查看每轮实验的选择依据。</p>
        <div id="events"></div>
      </section>
      <section class="panel inspector" aria-label="研究结果">
        <div class="view-bar">
          <button type="button" id="evidence-tab" class="view-button" aria-pressed="true" aria-controls="evidence">证据详情</button>
          <button type="button" id="report-tab" class="view-button" aria-pressed="false" aria-controls="result" disabled>研究报告</button>
        </div>
        <div id="evidence" class="view"><p class="empty muted">选择一轮实验，查看缓存开关的实测对照。</p></div>
        <div id="result" class="view" hidden>
          <div class="section-title"><p id="usage" class="muted"></p><a id="report-link" target="_blank" rel="noopener">打开 Markdown 原文 ↗</a></div>
          <div id="report"></div>
          <div id="report-experiments" class="report-experiments"></div>
        </div>
      </section>
    </div>
  </main>
</body>
</html>
