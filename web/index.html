<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Research Agent · 研究工作台</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%232fe3b0'/%3E%3Cpath d='M4.5 12h3l2-5 3.5 10 2.5-6 1.5 1h2' fill='none' stroke='%2304130e' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <noscript><p class="noscript">本工作台需要启用 JavaScript 才能发起实验并展示结果，请开启后刷新页面。</p></noscript>

  <header class="topbar">
    <div class="wrap topbar-inner">
      <div class="brand">
        <span class="mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 12h3.2l2.3-7 3.8 14 2.9-9 1.6 2h4.2"/>
          </svg>
        </span>
        <span class="brand-name">Research Agent</span>
        <span class="brand-sep" aria-hidden="true">/</span>
        <span class="brand-sub">研究工作台</span>
      </div>
    </div>
  </header>

  <div class="app-layout">
    <aside id="history" class="history" aria-label="研究历史">
      <button type="button" id="new-research" class="history-item">＋ 新建研究</button>
      <span class="history-label">研究历史</span>
      <nav id="history-list" class="history-list" aria-label="历史研究"></nav>
    </aside>
  <main class="wrap">
    <section class="hero">
      <p class="eyebrow">BoHack 2026</p>
      <h1>让 Agent 用实测数据回答<em>它自己的假设</em></h1>
      <p class="lede">输入关于 MLX 前缀缓存或不平衡分类的问题。Agent 会查找资料、运行本机实验并依据结果决定是否复测。</p>
    </section>

    <form id="research" class="config" aria-label="实验配置">
      <div class="field question-field">
        <label for="question">研究问题</label>
        <textarea id="question" maxlength="2000" rows="4" placeholder="例如：MLX 前缀缓存能否降低首 token 延迟？" required></textarea>
      </div>
      <details class="field research-settings">
        <summary>运行设置</summary>
        <label for="budget">实验次数上限（1–3）</label>
        <input id="budget" type="number" min="1" max="3" step="1" value="3" required>
      </details>
      <button class="primary" id="start" type="submit">
        <span>运行研究</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M5 12h13M13 6l6 6-6 6"/>
        </svg>
      </button>
    </form>

    <div class="workspace" hidden>
      <section class="panel timeline">
        <div class="panel-head">
          <h2>研究时间线</h2>
          <span id="status" class="status" role="status" data-state="idle">待运行</span>
        </div>
        <div id="progress" class="progress" hidden>
          <div class="progress-track" aria-hidden="true"><i id="progress-fill"></i></div>
          <span id="progress-text" class="progress-text"></span>
        </div>
        <p id="run-question" class="context"></p>
        <p id="context" class="context" hidden></p>
        <p id="hint" class="hint">发起研究后，每一轮实验的选择依据会出现在这里。</p>
        <div id="retrievals" class="retrievals"></div>
        <div id="events"></div>
      </section>

      <section class="panel inspector" aria-label="研究结果">
        <div class="view-bar">
          <button type="button" id="evidence-tab" class="view-button" aria-pressed="true" aria-controls="evidence">证据详情</button>
          <button type="button" id="report-tab" class="view-button" aria-pressed="false" aria-controls="result" disabled>研究报告</button>
          <span id="report-hint" class="view-hint">完成可看</span>
        </div>
        <div id="evidence" class="view">
          <div class="empty-state">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M4 19V5M4 19h16M8 15l3.2-4.4L14 14l2.8-3.6L19 13"/>
            </svg>
            <p>选择左侧任意一轮实验，查看缓存开关的实测对照。</p>
          </div>
        </div>
        <div id="result" class="view" hidden>
          <div class="report-head">
            <p id="usage" class="muted"></p>
            <div class="report-links">
              <a id="export-link" download>下载全部产物 ↓</a>
              <a id="report-link" target="_blank" rel="noopener">打开 Markdown 原文 ↗</a>
            </div>
          </div>
          <div id="report"></div>
          <div id="report-experiments" class="report-experiments"></div>
        </div>
      </section>
    </div>
  </main>
  </div>

  <footer class="wrap foot">
    <span>实验在本机运行</span>
    <span>每次运行生成独立记录与复跑命令</span>
  </footer>
</body>
</html>
