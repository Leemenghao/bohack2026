<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Research Agent · 研究工作台</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <header class="top"><div class="wrap brand"><span class="mark" aria-hidden="true">R</span> Research Agent</div></header>
  <div class="app-layout">
    <aside class="history" aria-label="研究历史">
      <button type="button" id="new-research">＋ 新建研究</button>
      <h2>研究历史</h2>
      <p id="history-hint" class="muted">正在载入…</p>
      <nav id="history-list" aria-label="历史研究"></nav>
    </aside>
    <main class="wrap">
    <h1>研究工作台</h1>
    <form id="research" class="panel">
      <div class="question-field">
        <label for="question">研究问题</label>
        <textarea id="question" maxlength="2000" rows="5" placeholder="例如：MLX 前缀缓存能否降低首 token 延迟？" required></textarea>
      </div>
      <div class="research-actions">
        <button class="primary" id="start">运行研究</button>
        <details class="research-settings">
          <summary>运行设置</summary>
          <label for="budget">实验次数上限（1–3）</label>
          <input id="budget" type="number" min="1" max="3" step="1" value="3" required>
        </details>
      </div>
    </form>
    <div class="workspace" hidden>
      <section class="panel timeline">
        <div class="section-title"><h2>研究时间线</h2><span id="status" class="status" role="status">待运行</span></div>
        <p id="context" class="context" hidden></p>
        <p id="hint" class="muted">发起研究后，在这里查看每轮实验的选择依据。</p>
        <div id="events"></div>
        <details id="sources" hidden>
          <summary>研究资料</summary>
          <ul id="source-list"></ul>
        </details>
      </section>
      <section class="panel inspector" aria-label="研究结果">
        <div class="view-bar">
          <button type="button" id="evidence-tab" class="view-button" aria-pressed="true" aria-controls="evidence">证据详情</button>
          <button type="button" id="report-tab" class="view-button" aria-pressed="false" aria-controls="result" disabled>研究报告</button>
        </div>
        <div id="evidence" class="view"><p class="empty muted">选择一轮实验，查看实测对照。</p></div>
        <div id="result" class="view" hidden>
          <div class="section-title"><p id="usage" class="muted"></p><a id="report-link" target="_blank" rel="noopener">打开 Markdown 原文 ↗</a></div>
          <div id="report"></div>
          <div id="report-experiments" class="report-experiments"></div>
        </div>
      </section>
    </div>
    </main>
  </div>
</body>
</html>
