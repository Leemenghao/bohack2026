[project]
name = "research-agent"
version = "0.7.37"

description = "BoHack Research Agent for evidence collection and local inference experiments."
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11,<4.0"
keywords = ["agents", "ai", "llm", "langgraph", "langchain", "deep-agent", "sub-agents", "agentic"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "httpx>=0.27,<1.0",
    "langchain>=1.5.0,<2.0.0",
    "langchain-core>=1.8.0,<2.0.0",
    "langchain-anthropic>=1.7.10,<2.0.0",
    "langchain-google-genai>=4.4.3,<5.0.0",
    "langchain-openai>=1.7.4,<2.0.0",
    "langsmith>=0.14.17",
    "packaging>=23.2",
    "python-dotenv>=1.2.2,<2.0",
    "scikit-learn==1.7.2",
    "wcmatch>=11.0",
]

[project.optional-dependencies]
aws = ["langchain-aws>=1.9.3,<2.0.0"]
quickjs = ["langchain-quickjs>=0.3.12"]
video = ["av>=18.0.0", "pillow>=12.3.0"]

[project.urls]
Homepage = "https://docs.langchain.com/oss/python/deepagents/overview"
Documentation = "https://reference.langchain.com/python/deepagents/"
Repository = "https://github.com/langchain-ai/deepagents"
Issues = "https://github.com/langchain-ai/deepagents/issues"
Twitter = "https://x.com/langchain_oss"
Slack = "https://www.langchain.com/join-community"
Reddit = "https://www.reddit.com/r/LangChain/"


[build-system]
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
include = ["research_agent", "research_agent.*"]

[tool.setuptools.package-data]
"*" = ["py.typed", "*.md"]
